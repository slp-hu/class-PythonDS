function calcStats(points) {
  const n = points.length;
  const meanX = points.reduce((s, p) => s + p.x, 0) / n;
  const meanY = points.reduce((s, p) => s + p.y, 0) / n;
  let Sxx = 0, Syy = 0, Sxy = 0;
  for (const p of points) {
    Sxx += (p.x - meanX) ** 2;
    Syy += (p.y - meanY) ** 2;
    Sxy += (p.x - meanX) * (p.y - meanY);
  }
  Sxx /= (n - 1); Syy /= (n - 1); Sxy /= (n - 1);
  const r = Sxy / Math.sqrt(Sxx * Syy);
  const slopeReg = Sxy / Sxx;
  const interceptReg = meanY - slopeReg * meanX;
  const tr = Sxx + Syy;
  const det = Sxx * Syy - Sxy * Sxy;
  const disc = Math.sqrt(tr * tr / 4 - det);
  const lam1 = tr / 2 + disc;
  const lam2 = tr / 2 - disc;
  let v1x = Sxy, v1y = lam1 - Sxx;
  const n1 = Math.hypot(v1x, v1y);
  v1x /= n1; v1y /= n1;
  if (v1x < 0) { v1x = -v1x; v1y = -v1y; }
  const v2x = -v1y, v2y = v1x;
  const slopePC1 = v1y / v1x;
  const interceptPC1 = meanY - slopePC1 * meanX;
  return {
    n, meanX, meanY, Sxx, Syy, Sxy, r,
    slopeReg, interceptReg,
    lam1, lam2, v1x, v1y, v2x, v2y,
    slopePC1, interceptPC1
  };
}

function ZoomDetail({ stats, pickIdx, setPickIdx, candidates }) {
  const P = candidates[pickIdx];
  const yReg = stats.slopeReg * P.x + stats.interceptReg;
  const footReg = { x: P.x, y: yReg };
  const dx = P.x - stats.meanX;
  const dy = P.y - stats.meanY;
  const t = dx * stats.v1x + dy * stats.v1y;
  const footPC = {
    x: stats.meanX + t * stats.v1x,
    y: stats.meanY + t * stats.v1y
  };
  const xs = [P.x, footReg.x, footPC.x];
  const ys = [P.y, footReg.y, footPC.y];
  const xc = (Math.min(...xs) + Math.max(...xs)) / 2;
  const yc = (Math.min(...ys) + Math.max(...ys)) / 2;
  const halfRange = Math.max(
    Math.max(...xs) - Math.min(...xs),
    Math.max(...ys) - Math.min(...ys)
  ) / 2 + 0.5;
  const xMin = xc - halfRange;
  const xMax = xc + halfRange;
  const yMin = yc - halfRange;
  const yMax = yc + halfRange;
  const W = 500, H = 400;
  const pad = { top: 20, right: 20, bottom: 30, left: 50 };
  const pw = W - pad.left - pad.right;
  const ph = H - pad.top - pad.bottom;
  const sx = (x) => pad.left + ((x - xMin) / (xMax - xMin)) * pw;
  const sy = (y) => pad.top + ph - ((y - yMin) / (yMax - yMin)) * ph;
  const regEnds = {
    x1: xMin, y1: stats.slopeReg * xMin + stats.interceptReg,
    x2: xMax, y2: stats.slopeReg * xMax + stats.interceptReg
  };
  const pcEnds = {
    x1: xMin, y1: stats.slopePC1 * xMin + stats.interceptPC1,
    x2: xMax, y2: stats.slopePC1 * xMax + stats.interceptPC1
  };
  const dyReg = P.y - yReg;
  const distPC = Math.hypot(P.x - footPC.x, P.y - footPC.y);

  return (
    <div className="bg-white rounded p-2 border border-gray-200">
      <div className="flex items-center gap-2 mb-2 flex-wrap">
        <span className="text-xs font-bold text-gray-700">点を選ぶ:</span>
        {candidates.map((c, i) => (
          <button
            key={i}
            onClick={() => setPickIdx(i)}
            className="px-2 py-1 text-xs rounded transition"
            style={{
              backgroundColor: pickIdx === i ? c.color : '#f3f4f6',
              color: pickIdx === i ? 'white' : '#374151',
              fontWeight: pickIdx === i ? 'bold' : 'normal'
            }}
          >
            {c.label}
          </button>
        ))}
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full">
        {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
          <g key={i}>
            <line x1={pad.left} y1={pad.top + ph * t} x2={W - pad.right} y2={pad.top + ph * t} stroke="#f3f4f6" strokeWidth="1"/>
            <line x1={pad.left + pw * t} y1={pad.top} x2={pad.left + pw * t} y2={H - pad.bottom} stroke="#f3f4f6" strokeWidth="1"/>
          </g>
        ))}
        <line x1={pad.left} y1={H - pad.bottom} x2={W - pad.right} y2={H - pad.bottom} stroke="#9ca3af" strokeWidth="1"/>
        <line x1={pad.left} y1={pad.top} x2={pad.left} y2={H - pad.bottom} stroke="#9ca3af" strokeWidth="1"/>
        {[0, 0.5, 1].map((t, i) => {
          const xVal = xMin + (xMax - xMin) * t;
          const yVal = yMin + (yMax - yMin) * t;
          return (
            <g key={`tk-${i}`}>
              <text x={pad.left + pw * t} y={H - pad.bottom + 12} textAnchor="middle" fontSize="9" fill="#9ca3af">{xVal.toFixed(2)}</text>
              <text x={pad.left - 4} y={pad.top + ph * (1 - t) + 3} textAnchor="end" fontSize="9" fill="#9ca3af">{yVal.toFixed(2)}</text>
            </g>
          );
        })}
        <line x1={sx(pcEnds.x1)} y1={sy(pcEnds.y1)} x2={sx(pcEnds.x2)} y2={sy(pcEnds.y2)} stroke="#a855f7" strokeWidth="2" strokeDasharray="6,3"/>
        <line x1={sx(regEnds.x1)} y1={sy(regEnds.y1)} x2={sx(regEnds.x2)} y2={sy(regEnds.y2)} stroke="#10b981" strokeWidth="2.5"/>
        <line x1={sx(P.x)} y1={sy(P.y)} x2={sx(footReg.x)} y2={sy(footReg.y)} stroke="#10b981" strokeWidth="2.5" strokeDasharray="2,2"/>
        <circle cx={sx(footReg.x)} cy={sy(footReg.y)} r="3" fill="#10b981" stroke="white" strokeWidth="1"/>
        <line x1={sx(P.x)} y1={sy(P.y)} x2={sx(footPC.x)} y2={sy(footPC.y)} stroke="#a855f7" strokeWidth="2.5" strokeDasharray="2,2"/>
        <circle cx={sx(footPC.x)} cy={sy(footPC.y)} r="3" fill="#a855f7" stroke="white" strokeWidth="1"/>
        {(() => {
          const fpx = sx(footPC.x), fpy = sy(footPC.y);
          const a_dx = sx(footPC.x + stats.v1x) - fpx;
          const a_dy = sy(footPC.y + stats.v1y) - fpy;
          const a_len = Math.hypot(a_dx, a_dy);
          if (a_len < 1e-6) return null;
          const a_nx = a_dx / a_len, a_ny = a_dy / a_len;
          const r_dx = sx(P.x) - fpx;
          const r_dy = sy(P.y) - fpy;
          const r_len = Math.hypot(r_dx, r_dy);
          if (r_len < 1e-6) return null;
          const r_nx = r_dx / r_len, r_ny = r_dy / r_len;
          const size = 8;
          const p1 = [fpx + a_nx * size, fpy + a_ny * size];
          const p2 = [fpx + a_nx * size + r_nx * size, fpy + a_ny * size + r_ny * size];
          const p3 = [fpx + r_nx * size, fpy + r_ny * size];
          return (
            <polyline
              points={`${p1[0]},${p1[1]} ${p2[0]},${p2[1]} ${p3[0]},${p3[1]}`}
              fill="none" stroke="#a855f7" strokeWidth="1.2"
            />
          );
        })()}
        <circle cx={sx(P.x)} cy={sy(P.y)} r="11" fill="none" stroke={P.color} strokeWidth="2.5"/>
        <circle cx={sx(P.x)} cy={sy(P.y)} r="6" fill={P.color} stroke="white" strokeWidth="2"/>
        <text x={sx(P.x) + 14} y={sy(P.y) - 8} fontSize="11" fill={P.color} fontWeight="bold">
          {P.label}
        </text>
        <text x={sx(P.x) + 14} y={sy(P.y) + 4} fontSize="9" fill="#6b7280">
          ({P.x.toFixed(2)}, {P.y.toFixed(2)})
        </text>
        <text x={sx(footReg.x) - 5} y={sy((P.y + footReg.y) / 2)} fontSize="11" fill="#10b981" fontWeight="bold" textAnchor="end">
          縦距離 = {Math.abs(dyReg).toFixed(2)}
        </text>
        <text x={sx((P.x + footPC.x) / 2) + 6} y={sy((P.y + footPC.y) / 2) - 4} fontSize="11" fill="#a855f7" fontWeight="bold">
          垂直距離 = {distPC.toFixed(2)}
        </text>
        <g transform={`translate(${W - 160}, ${pad.top + 5})`}>
          <line x1="0" y1="6" x2="20" y2="6" stroke="#10b981" strokeWidth="2.5"/>
          <text x="25" y="10" fontSize="10" fill="#10b981" fontWeight="bold">回帰直線</text>
          <line x1="0" y1="22" x2="20" y2="22" stroke="#a855f7" strokeWidth="2" strokeDasharray="6,3"/>
          <text x="25" y="26" fontSize="10" fill="#a855f7" fontWeight="bold">主軸(PCA)</text>
        </g>
      </svg>
      <div className="text-xs text-gray-700 mt-1 px-2">
        同じ点でも、<span className="text-green-700 font-bold">回帰では「縦に下ろした足」までの距離</span>を測り、
        <span className="text-purple-700 font-bold">主軸では「直線へ垂直に下ろした足」までの距離</span>を測る。
      </div>
    </div>
  );
}

function MainPlot({ data, stats, stage, showRegLine, showPC1, showEllipse, ellipseScale, pickIdx, zoomCandidates, xLabel, yLabel, equalScale }) {
  const bounds = useMemo(() => {
    const xs = data.map(p => p.x);
    const ys = data.map(p => p.y);
    let xMin = Math.min(...xs), xMax = Math.max(...xs);
    let yMin = Math.min(...ys), yMax = Math.max(...ys);
    if (equalScale) {
      const m = Math.max(Math.abs(xMin), Math.abs(xMax), Math.abs(yMin), Math.abs(yMax)) * 1.15;
      return { xMin: -m, xMax: m, yMin: -m, yMax: m };
    }
    return {
      xMin: xMin - (xMax - xMin) * 0.05,
      xMax: xMax + (xMax - xMin) * 0.05,
      yMin: yMin - (yMax - yMin) * 0.05,
      yMax: yMax + (yMax - yMin) * 0.05
    };
  }, [data, equalScale]);

  const W = equalScale ? 500 : 600, H = equalScale ? 500 : 450;
  const padding = equalScale 
    ? { top: 30, right: 30, bottom: 50, left: 50 }  // 等スケール時:プロット領域を正方形に(420×420)
    : { top: 30, right: 30, bottom: 50, left: 70 };
  const plotW = W - padding.left - padding.right;
  const plotH = H - padding.top - padding.bottom;
  const sx = (x) => padding.left + ((x - bounds.xMin) / (bounds.xMax - bounds.xMin)) * plotW;
  const sy = (y) => padding.top + plotH - ((y - bounds.yMin) / (bounds.yMax - bounds.yMin)) * plotH;

  const ellipsePoints = useMemo(() => {
    const pts = [];
    const k = ellipseScale;
    for (let i = 0; i <= 100; i++) {
      const theta = (i / 100) * 2 * Math.PI;
      const a = Math.sqrt(stats.lam1) * k;
      const b = Math.sqrt(stats.lam2) * k;
      const x_local = a * Math.cos(theta);
      const y_local = b * Math.sin(theta);
      const dx = x_local * stats.v1x + y_local * stats.v2x;
      const dy = x_local * stats.v1y + y_local * stats.v2y;
      pts.push([stats.meanX + dx, stats.meanY + dy]);
    }
    return pts;
  }, [stats, ellipseScale]);

  const lineEnds = (slope, intercept) => {
    const y1 = slope * bounds.xMin + intercept;
    const y2 = slope * bounds.xMax + intercept;
    return { x1: bounds.xMin, y1, x2: bounds.xMax, y2 };
  };

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full">
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
        <g key={i}>
          <line x1={padding.left} y1={padding.top + plotH * t} x2={W - padding.right} y2={padding.top + plotH * t} stroke="#e5e7eb" strokeWidth="1"/>
          <line x1={padding.left + plotW * t} y1={padding.top} x2={padding.left + plotW * t} y2={H - padding.bottom} stroke="#e5e7eb" strokeWidth="1"/>
        </g>
      ))}
      {bounds.yMin < 0 && bounds.yMax > 0 && (
        <line x1={padding.left} y1={sy(0)} x2={W - padding.right} y2={sy(0)} stroke="#9ca3af" strokeWidth="1" strokeDasharray="4,3"/>
      )}
      {bounds.xMin < 0 && bounds.xMax > 0 && equalScale && (
        <line x1={sx(0)} y1={padding.top} x2={sx(0)} y2={H - padding.bottom} stroke="#9ca3af" strokeWidth="1" strokeDasharray="4,3"/>
      )}
      <line x1={padding.left} y1={H - padding.bottom} x2={W - padding.right} y2={H - padding.bottom} stroke="#374151" strokeWidth="2"/>
      <line x1={padding.left} y1={padding.top} x2={padding.left} y2={H - padding.bottom} stroke="#374151" strokeWidth="2"/>
      <text x={W / 2} y={H - 10} textAnchor="middle" fontSize="13" fill="#374151" fontWeight="bold">{xLabel}</text>
      <text x={18} y={H / 2} textAnchor="middle" fontSize="13" fill="#374151" fontWeight="bold" transform={`rotate(-90, 18, ${H / 2})`}>{yLabel}</text>
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => {
        const xVal = bounds.xMin + (bounds.xMax - bounds.xMin) * t;
        const yVal = bounds.yMin + (bounds.yMax - bounds.yMin) * t;
        return (
          <g key={`tick-${i}`}>
            <text x={padding.left + plotW * t} y={H - padding.bottom + 15} textAnchor="middle" fontSize="10" fill="#6b7280">{equalScale ? xVal.toFixed(1) : xVal.toFixed(0)}</text>
            <text x={padding.left - 5} y={padding.top + plotH * (1 - t) + 3} textAnchor="end" fontSize="10" fill="#6b7280">{equalScale ? yVal.toFixed(1) : yVal.toFixed(0)}</text>
          </g>
        );
      })}

      {showEllipse && (
        <polyline
          fill="rgba(99, 102, 241, 0.08)"
          stroke="#6366f1"
          strokeWidth="1.5"
          points={ellipsePoints.map(([x, y]) => `${sx(x)},${sy(y)}`).join(' ')}
        />
      )}

      {showPC1 && (() => {
        const { x1, y1, x2, y2 } = lineEnds(stats.slopePC1, stats.interceptPC1);
        const k = ellipseScale;
        const tipX = stats.meanX + stats.v1x * Math.sqrt(stats.lam1) * k;
        const tipY = stats.meanY + stats.v1y * Math.sqrt(stats.lam1) * k;
        return (
          <g>
            <line x1={sx(x1)} y1={sy(y1)} x2={sx(x2)} y2={sy(y2)} stroke="#a855f7" strokeWidth="2.5" strokeDasharray="6,3"/>
            <line x1={sx(stats.meanX)} y1={sy(stats.meanY)} x2={sx(tipX)} y2={sy(tipY)} stroke="#a855f7" strokeWidth="3" markerEnd="url(#arrPurple)"/>
            <text x={sx(tipX) + 6} y={sy(tipY) - 6} fontSize="12" fill="#a855f7" fontWeight="bold">第1主軸</text>
          </g>
        );
      })()}

      {showRegLine && (() => {
        const { x1, y1, x2, y2 } = lineEnds(stats.slopeReg, stats.interceptReg);
        return <line x1={sx(x1)} y1={sy(y1)} x2={sx(x2)} y2={sy(y2)} stroke="#10b981" strokeWidth="3"/>;
      })()}

      {data.map((p, i) => (
        <circle key={i} cx={sx(p.x)} cy={sy(p.y)} r="3" fill="#1f2937" opacity="0.6"/>
      ))}

      {(stage === 3 || !equalScale) && (() => {
        const P = zoomCandidates[pickIdx];
        return (
          <g>
            <circle cx={sx(P.x)} cy={sy(P.y)} r="11" fill="none" stroke={P.color} strokeWidth="2.5"/>
            <circle cx={sx(P.x)} cy={sy(P.y)} r="5" fill={P.color} stroke="white" strokeWidth="2"/>
            <text x={sx(P.x) + 14} y={sy(P.y) + 4} fontSize="12" fill={P.color} fontWeight="bold">
              {P.label}
            </text>
          </g>
        );
      })()}

      <g>
        <circle cx={sx(stats.meanX)} cy={sy(stats.meanY)} r="7" fill="#f59e0b" stroke="white" strokeWidth="2"/>
        <text x={sx(stats.meanX) + 12} y={sy(stats.meanY) - 8} fontSize="11" fill="#f59e0b" fontWeight="bold">
          (x̄, ȳ) = ({stats.meanX.toFixed(2)}, {stats.meanY.toFixed(2)})
        </text>
      </g>

      <g transform={`translate(${W - padding.right - 175}, ${padding.top})`}>
        {showRegLine && (
          <g>
            <line x1="0" y1="6" x2="25" y2="6" stroke="#10b981" strokeWidth="3"/>
            <text x="32" y="10" fontSize="11" fill="#10b981" fontWeight="bold">回帰直線</text>
          </g>
        )}
        {showPC1 && (
          <g transform="translate(0, 18)">
            <line x1="0" y1="6" x2="25" y2="6" stroke="#a855f7" strokeWidth="2.5" strokeDasharray="6,3"/>
            <text x="32" y="10" fontSize="11" fill="#a855f7" fontWeight="bold">第1主軸</text>
          </g>
        )}
      </g>

      <defs>
        <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <polygon points="0 0, 8 4, 0 8" fill="#a855f7"/>
        </marker>
      </defs>
    </svg>
  );
}

function App() {
  const [mode, setMode] = useState('std');
  const [stage, setStage] = useState(0);
  const [ellipseScale, setEllipseScale] = useState(2);
  const [pickIdxStd, setPickIdxStd] = useState(0);
  const [pickIdxRaw, setPickIdxRaw] = useState(0);

  const rawData = useMemo(() => DATA.map(([x, y]) => ({ x, y })), []);
  const rawStats = useMemo(() => calcStats(rawData), [rawData]);

  const stdData = useMemo(() => {
    const sx = Math.sqrt(rawStats.Sxx);
    const sy = Math.sqrt(rawStats.Syy);
    return rawData.map(p => ({
      x: (p.x - rawStats.meanX) / sx,
      y: (p.y - rawStats.meanY) / sy
    }));
  }, [rawData, rawStats]);
  const stdStats = useMemo(() => calcStats(stdData), [stdData]);

  const zoomBaseCandidates = [
    { rawX: 109.147, rawY: 398.408, label: '点A(右上)', color: '#dc2626' },
    { rawX: 31.991, rawY: -108.409, label: '点B(左下)', color: '#f59e0b' },
    { rawX: 18.216, rawY: -104.583, label: '点C(左)', color: '#0ea5e9' },
  ];
  const sxv = Math.sqrt(rawStats.Sxx), syv = Math.sqrt(rawStats.Syy);
  const stdCandidates = zoomBaseCandidates.map(c => ({
    x: (c.rawX - rawStats.meanX) / sxv,
    y: (c.rawY - rawStats.meanY) / syv,
    label: c.label, color: c.color
  }));
  const rawCandidates = zoomBaseCandidates.map(c => ({
    x: c.rawX, y: c.rawY, label: c.label, color: c.color
  }));

  const showEllipse = stage >= 1;
  const showRegLine = stage >= 2;
  const showPC1 = stage >= 3;

  const stagesStd = [
    { name: '① 標準化', desc: 'データを z スコア化(平均0、分散1)— x と y のスケールを揃える' },
    { name: '② 相関行列', desc: '標準化された共分散行列(=相関行列)— 対角は1、非対角は r' },
    { name: '③ 回帰係数', desc: '標準化空間では、回帰の傾き a = r(相関係数そのもの)' },
    { name: '④ 主軸 vs 回帰', desc: 'スケールが揃うと主軸は綺麗な角度。回帰直線との違いがはっきり見える' }
  ];

  const isStd = mode === 'std';
  const stats = isStd ? stdStats : rawStats;
  const data = isStd ? stdData : rawData;
  const candidates = isStd ? stdCandidates : rawCandidates;
  const pickIdx = isStd ? pickIdxStd : pickIdxRaw;
  const setPickIdx = isStd ? setPickIdxStd : setPickIdxRaw;
  const xLabel = isStd ? '標準化された広告費  (x − x̄) / σ_x' : '広告費 x';
  const yLabel = isStd ? '標準化された売上高  (y − ȳ) / σ_y' : '売上高 y';

  return (
    <div className="w-full max-w-6xl mx-auto p-4 bg-white">
      <h1 className="text-2xl font-bold mb-2 text-gray-800">回帰を「分布の形」から見る</h1>
      <p className="text-sm text-gray-600 mb-4">共分散行列・固有ベクトル・相関係数 と 回帰直線の関係</p>

      <div className="flex gap-2 mb-4">
        <button
          onClick={() => { setMode('std'); setStage(0); }}
          className={`px-4 py-2 rounded text-sm font-bold transition ${
            mode === 'std' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
          }`}
        >
          標準化された空間で見る(メイン)
        </button>
        <button
          onClick={() => { setMode('raw'); setStage(3); }}
          className={`px-4 py-2 rounded text-sm font-bold transition ${
            mode === 'raw' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
          }`}
        >
          実スケールで見る(対比)
        </button>
      </div>

      {isStd && (
        <div>
          <div className="flex gap-2 mb-4 flex-wrap">
            {stagesStd.map((s, i) => (
              <button
                key={i}
                onClick={() => setStage(i)}
                className={`px-3 py-2 rounded text-sm transition ${
                  stage === i ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                }`}
              >
                {s.name}
              </button>
            ))}
          </div>
          <div className="text-sm text-gray-700 mb-3 px-3 py-2 bg-blue-50 rounded">
            {stagesStd[stage].desc}
          </div>
        </div>
      )}

      {!isStd && (
        <div className="text-sm text-gray-700 mb-3 px-3 py-2 bg-blue-50 rounded">
          x と y のスケールが違うと、主軸は縦長に伸びる
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: 'row', gap: '8px', marginBottom: '16px' }}>
        <div className="bg-gray-50 rounded-lg p-2" style={{ flex: (stage === 3 || !isStd) ? '1 1 60%' : '0 0 65%', minWidth: 0 }}>
          <MainPlot
            data={data}
            stats={stats}
            stage={stage}
            showRegLine={isStd ? showRegLine : true}
            showPC1={isStd ? showPC1 : true}
            showEllipse={isStd ? showEllipse : true}
            ellipseScale={ellipseScale}
            pickIdx={pickIdx}
            zoomCandidates={candidates}
            xLabel={xLabel}
            yLabel={yLabel}
            equalScale={isStd}
          />
        </div>
        {(stage === 3 || !isStd) && (
          <div className="bg-gray-50 rounded-lg p-2" style={{ flex: '1 1 40%', minWidth: 0 }}>
            <ZoomDetail
              stats={stats}
              pickIdx={pickIdx}
              setPickIdx={setPickIdx}
              candidates={candidates}
            />
          </div>
        )}
      </div>

      {(isStd ? showEllipse : true) && (
        <div className="mb-3 px-3 py-2 bg-gray-50 rounded text-sm">
          <label className="text-xs text-gray-700">等密度楕円の大きさ:{ellipseScale.toFixed(1)} σ</label>
          <input
            type="range" min={0.5} max={3} step={0.1}
            value={ellipseScale} onChange={(e) => setEllipseScale(parseFloat(e.target.value))}
            className="w-full"
          />
        </div>
      )}

      {isStd && stage === 0 && (
        <div className="bg-amber-50 border border-amber-200 rounded p-3 mb-4 text-sm">
          <div className="font-bold text-amber-900 mb-2">標準化(z スコア化)— x と y のスケールを揃える</div>
          <p className="text-xs text-amber-900 mb-2">
            元のデータでは x(広告費)と y(売上高)の単位もスケールも違います。
            これだと「分布の形」を見るときに、y方向の大きな広がりに引きずられてしまいます。
            そこで、各変数を「平均 0、分散 1」になるように変換します:
          </p>
          <div className="font-mono text-xs bg-white p-3 rounded mb-2">
            z_x = (x − x̄) / σ_x &nbsp;&nbsp;&nbsp; σ_x = √Sₓₓ = {Math.sqrt(rawStats.Sxx).toFixed(2)}<br/>
            z_y = (y − ȳ) / σ_y &nbsp;&nbsp;&nbsp; σ_y = √S_yy = {Math.sqrt(rawStats.Syy).toFixed(2)}
          </div>
          <p className="text-xs text-amber-900">
            標準化後の空間では、x も y も「平均 0、分散 1」になっているので、分布の形(楕円)を素直に見ることができます。
          </p>
        </div>
      )}

      {isStd && stage === 1 && (
        <div className="bg-indigo-50 border border-indigo-200 rounded p-3 mb-4 text-sm">
          <div className="font-bold text-indigo-900 mb-2">標準化空間の共分散行列 = 相関行列</div>
          <div className="font-mono text-xs bg-white p-3 rounded mb-2 leading-relaxed">
            <div>Sₓₓ(z_xの分散) = <strong>{stdStats.Sxx.toFixed(4)}</strong> ≈ 1</div>
            <div>S_yy(z_yの分散) = <strong>{stdStats.Syy.toFixed(4)}</strong> ≈ 1</div>
            <div>Sₓ_y(共分散) = <strong>{stdStats.Sxy.toFixed(4)}</strong> = 相関係数 r</div>
            <div className="mt-2">
              Σ_std = ⎡ 1&nbsp;&nbsp;r ⎤ = ⎡ 1.00&nbsp;&nbsp;{stdStats.Sxy.toFixed(2)} ⎤<br/>
              <span className="ml-3">⎣ r&nbsp;&nbsp;1 ⎦ &nbsp;&nbsp;⎣ {stdStats.Sxy.toFixed(2)}&nbsp;&nbsp;1.00 ⎦</span>
            </div>
          </div>
          <p className="text-xs text-indigo-900">
            標準化された空間では、共分散行列は <strong>相関行列</strong> と一致します。
            対角要素は 1(各変数の分散)、非対角要素は <strong>相関係数 r = {stdStats.Sxy.toFixed(3)}</strong>。
            楕円は「45°方向(相関の方向)」に綺麗に伸びているはずです。
          </p>
        </div>
      )}

      {isStd && stage === 2 && (
        <div className="bg-green-50 border border-green-200 rounded p-3 mb-4 text-sm">
          <div className="font-bold text-green-900 mb-2">標準化空間では、回帰係数 = 相関係数</div>
          <div className="font-mono text-sm bg-white p-3 rounded mb-2 leading-loose">
            <div>傾き&nbsp;&nbsp; a = Sₓ_y / Sₓₓ = {stdStats.Sxy.toFixed(4)} / {stdStats.Sxx.toFixed(4)} = <strong className="text-green-700">{stdStats.slopeReg.toFixed(4)}</strong></div>
            <div>切片&nbsp;&nbsp; b = ȳ − a·x̄ ≈ <strong>{stdStats.interceptReg.toFixed(4)}</strong>(原点を通る)</div>
          </div>
          <p className="text-xs text-green-900 mb-2">
            標準化空間では、分母の Sₓₓ = 1、分子の Sₓ_y = r なので、<strong>回帰の傾き = 相関係数 r</strong> という美しい関係が現れます。
            切片はほぼ 0(両方の平均が 0 なので、回帰直線は原点を通る)。
          </p>
          <p className="text-xs text-green-900">
            元のスケールでは a = r × (σ_y / σ_x) と書けるのは、まさにこの「標準化空間での a = r」を実スケールに戻したものです。
          </p>
        </div>
      )}

      {isStd && stage === 3 && (
        <div className="bg-rose-50 border border-rose-200 rounded p-3 mb-4 text-sm">
          <div className="font-bold text-rose-900 mb-2">楕円の主軸 ≠ 回帰直線(これが「あてはめ」の本質)</div>
          <div style={{ display: 'flex', flexDirection: 'row', gap: '12px' }}>
            <div style={{ flex: '1 1 50%', minWidth: 0 }}>
              <p className="text-xs text-rose-900 mb-2">
                標準化空間では分布は対称(σ_x = σ_y = 1)なので、共分散行列の固有ベクトルは綺麗に <strong>±45° 方向</strong> を向きます:
              </p>
              <div className="font-mono text-xs bg-white p-3 rounded mb-2 leading-relaxed">
                <div>固有値:λ₁ = 1 + r = <strong>{stdStats.lam1.toFixed(3)}</strong></div>
                <div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; λ₂ = 1 − r = <strong>{stdStats.lam2.toFixed(3)}</strong></div>
                <div className="mt-1">第1固有ベクトル v₁ ≈ ({stdStats.v1x.toFixed(3)}, {stdStats.v1y.toFixed(3)})</div>
                <div className="mt-2">
                  <span className="text-purple-700">主軸の傾き</span> = <strong>{stdStats.slopePC1.toFixed(3)}</strong>(45°)
                </div>
                <div>
                  <span className="text-green-700">回帰の傾き</span> = <strong>{stdStats.slopeReg.toFixed(3)}</strong>(= r)
                </div>
                <div className="text-rose-700 mt-1 font-bold">→ 主軸は 45°、回帰は arctan(r) で寝ている</div>
              </div>
            </div>
            <div style={{ flex: '1 1 50%', minWidth: 0 }}>
              <ul className="text-xs text-rose-900 ml-4 list-disc space-y-1">
                <li><span className="text-green-700 font-bold">回帰直線</span>:点から直線への<strong>縦方向の距離</strong>の二乗和を最小化</li>
                <li><span className="text-purple-700 font-bold">第1主軸</span>:点から直線への<strong>垂直距離</strong>の二乗和を最小化(=主成分分析)</li>
              </ul>
              <p className="text-xs text-rose-900 mt-2">
                回帰では「x は誤差なし、y のみに誤差がある」と仮定。だから「分布の自然な主軸」より<strong>寝た傾き</strong>(arctan(r) {'<'} 45°)になる。
                これが <strong>regression toward the mean</strong> の起源です。
              </p>
              <div className="font-mono text-xs bg-white p-2 rounded mt-2">
                <strong>標準化空間での関係:</strong><br/>
                主軸の傾き = 1(常に 45°)<br/>
                回帰の傾き = r = {stdStats.r.toFixed(3)}
              </div>
            </div>
          </div>
        </div>
      )}

      {!isStd && (
        <div className="bg-orange-50 border border-orange-200 rounded p-3 mb-4 text-sm">
          <div className="font-bold text-orange-900 mb-2">実スケールでは何が起こるか</div>
          <div className="text-xs text-orange-800 bg-orange-100 rounded px-2 py-1 mb-2">
            <strong>※注:</strong> 画面上で楕円が斜めに見え、主軸(紫の線)が長軸の方向と一致しないのは、x と y のピクセルスケールが違うための<strong>視覚的なズレ</strong>です。
            データ座標上では、主軸は確かに楕円の長軸を通っています。標準化空間に戻ると、両者は綺麗に一致します。
          </div>
          <div style={{ display: 'flex', flexDirection: 'row', gap: '12px' }}>
            <div style={{ flex: '1 1 50%', minWidth: 0 }}>
              <p className="text-xs text-orange-900 mb-2">
                標準化を解除して元の単位(広告費・売上高)に戻すと、y のスケールが x より <strong>{(Math.sqrt(rawStats.Syy / rawStats.Sxx)).toFixed(1)} 倍</strong>大きいため、
                共分散行列の固有ベクトルもそれに引きずられて<strong>ほぼ縦向き</strong>になります。
              </p>
              <div className="font-mono text-xs bg-white p-3 rounded mb-2 leading-relaxed">
                <div>σ_x = √Sₓₓ = <strong>{Math.sqrt(rawStats.Sxx).toFixed(2)}</strong></div>
                <div>σ_y = √S_yy = <strong>{Math.sqrt(rawStats.Syy).toFixed(2)}</strong>(σ_xの{(Math.sqrt(rawStats.Syy / rawStats.Sxx)).toFixed(1)}倍)</div>
                <div className="mt-2">固有値:λ₁ = <strong>{rawStats.lam1.toFixed(0)}</strong>, λ₂ = <strong>{rawStats.lam2.toFixed(2)}</strong></div>
                <div className="mt-2">
                  <span className="text-purple-700">主軸の傾き</span> = <strong>{rawStats.slopePC1.toFixed(2)}</strong>
                </div>
                <div>
                  <span className="text-green-700">回帰の傾き</span> = <strong>{rawStats.slopeReg.toFixed(3)}</strong>
                </div>
                <div className="text-orange-700 mt-1 font-bold">主軸 ≫ 回帰(主軸はほぼ縦向き)</div>
              </div>
            </div>
            <div style={{ flex: '1 1 50%', minWidth: 0 }}>
              <p className="text-xs text-orange-900 mb-2">
                <strong>主軸はスケールに依存する</strong> — x または y の単位を変える(円→千円 など)と、主軸の角度は変わってしまう。
                これは PCA の弱点で、PCA を行う前に「データを標準化する」のが定番なのはこのため。
              </p>
              <p className="text-xs text-orange-900 mb-2">
                <strong>回帰直線はスケール変換に予測しやすい挙動</strong> — y のスケールを k 倍すれば傾きも k 倍。
                単位を変えても「予測の関係」は同じ。
              </p>
              <div className="font-mono text-xs bg-white p-2 rounded mt-2">
                <strong>標準化版との対応:</strong><br/>
                回帰の傾き = r × (σ_y / σ_x) = {rawStats.r.toFixed(3)} × {(Math.sqrt(rawStats.Syy / rawStats.Sxx)).toFixed(2)} = <strong>{(rawStats.r * Math.sqrt(rawStats.Syy / rawStats.Sxx)).toFixed(3)}</strong>
              </div>
            </div>
          </div>
        </div>
      )}

      <div className="grid grid-cols-3 gap-3 mb-3">
        <div className="bg-gradient-to-br from-indigo-50 to-indigo-100 p-3 rounded">
          <div className="text-xs text-indigo-700">相関係数 r</div>
          <div className="text-xl font-bold text-indigo-700">{stats.r.toFixed(4)}</div>
          <div className="text-[10px] text-indigo-600 mt-1">(スケールに依存しない)</div>
        </div>
        <div className="bg-gradient-to-br from-green-50 to-green-100 p-3 rounded">
          <div className="text-xs text-green-700">回帰の傾き</div>
          <div className="text-xl font-bold text-green-700">{stats.slopeReg.toFixed(4)}</div>
          <div className="text-[10px] text-green-600 mt-1">{isStd ? '= r(標準化空間)' : '= r × σ_y/σ_x'}</div>
        </div>
        <div className="bg-gradient-to-br from-purple-50 to-purple-100 p-3 rounded">
          <div className="text-xs text-purple-700">主軸の傾き</div>
          <div className="text-xl font-bold text-purple-700">{stats.slopePC1.toFixed(4)}</div>
          <div className="text-[10px] text-purple-600 mt-1">{isStd ? '= 1(常に 45°)' : '(スケール依存)'}</div>
        </div>
      </div>

      <div className="text-xs text-gray-600 leading-relaxed border-t pt-3">
        <p>
          <strong>まとめ:</strong> 標準化空間で見ると、線形回帰の本質が綺麗に立ち上がります — <strong>傾き = 相関係数 r</strong>。
          主軸は常に 45°(対称分布のため)で、回帰直線は arctan(r) の角度。回帰は <strong>縦方向の誤差</strong>を、
          主軸は <strong>垂直距離</strong>を最小化するという違いが、図でクリアに見えます。
          実スケールに戻すと、両者は y/x のスケール比に応じて変形しますが、「縦か垂直か」という本質は変わりません。
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
